<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Desktop Cat - Debug</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      #cat {
        position: absolute;
        left: 50%;
        bottom: 0;
        display: block;
        width: var(--cat-size, 120px);
        height: auto;
        -webkit-user-drag: none;
        user-select: none;
        pointer-events: auto;
        transform-origin: center bottom;
      }
    </style>
  </head>
  <body>
    <img id="cat" src="../optimized-assets/basic_posture.png" alt="cat" />
    <script src="./petView.js"></script>
    <script src="./debugConfig.js"></script>
    <script src="./animationController.js"></script>
    <script src="./movementController.js"></script>
    <script src="./mouseTracker.js"></script>
    <script src="./huntController.js"></script>
    <script src="./catController.js"></script>
    <script src="./debugController.js"></script>
  </body>
</html>
